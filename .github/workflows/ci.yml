name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure x64
        run: cmake --preset msvc-dev
      - name: Build
        run: cmake --build --preset msvc-dev --parallel 2
      - name: Test
        run: ctest --preset msvc-dev
      - name: Verify product build and runtime boundary
        run: |
          cmake --preset msvc-release
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build --preset msvc-release --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed' }
          cmake --install build/msvc-release --config Release --prefix out/runtime-msvc --component Runtime
          if ($LASTEXITCODE) { throw 'Runtime staging failed' }
          pwsh -File scripts/verify-runtime.ps1 -Path out/runtime-msvc
          if ($LASTEXITCODE) { throw 'Runtime boundary failed' }
      - name: Verify pinned data
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_generated_data.py
      - name: Check PowerShell syntax
        run: |
          $scripts = Get-ChildItem scripts,testbench -Filter *.ps1
          foreach ($script in $scripts) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

  mingw:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure, build and test x64
        shell: msys2 {0}
        run: |
          set -e
          cmake --preset mingw-dev
          cmake --build --preset mingw-dev --parallel 2
          ctest --preset mingw-dev
          cmake --preset mingw-release
          cmake --build --preset mingw-release --parallel 2
          cmake --install build/mingw-release --prefix out/runtime-mingw --component Runtime
      - name: Verify runtime boundary
        shell: pwsh
        run: pwsh -File scripts/verify-runtime.ps1 -Path out/runtime-mingw
